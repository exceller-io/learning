name: Vercel deployment workflow

on:
  push:
    branches:
      - main
      - staging

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  
jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn run db:generate

      - name: Install Vercel CLI
        run: yarn global add vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ env.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ env.VERCEL_TOKEN }}

      - name: Deploy preview to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ env.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Print preview URL
        run: echo "Preview deployed to ${{ steps.deploy.outputs.url }}"

  promote-to-production:
    name: Promote to Production
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      pull-requests: read
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

    steps:
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Find preview deployment URL with READY state from vercel
        id: preview
        run: | 
          PREVIEW_URL=$(vercel ls learning --token=${{ env.VERCEL_TOKEN }} --environment=preview --format=json | jq -r '.deployments | map(select(.state == "READY")) | first | .url')
          echo="url=${PREVIEW_URL}"

      - name: Promote preview to production
        if: steps.preview.outputs.url != ''
        run: vercel promote ${{ steps.preview.outputs.url }} --token=${{ env.VERCEL_TOKEN }}

      # Fallback: full build + production deploy when no preview deployment exists
      - name: Checkout
        if: steps.preview.outputs.url == ''
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.preview.outputs.url == ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        if: steps.preview.outputs.url == ''
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.preview.outputs.url == ''
        run: yarn run db:generate

      - name: Build
        if: steps.preview.outputs.url == ''
        run: yarn run build

      - name: Pull Vercel environment
        if: steps.preview.outputs.url == ''
        run: vercel pull --yes --environment=production --token=${{ env.VERCEL_TOKEN }}

      - name: Deploy to production
        if: steps.preview.outputs.url == ''
        run: vercel deploy --prod --token=${{ env.VERCEL_TOKEN }}
